; Required Resource Manifest Editor deployment configuration.
[ResourceManifestEditor]
formatVersion=1
; Optional complete application bundle. Relative paths use this INI directory.
; baseBundle=../share/example/resource-schema-bundle
; Ordered extensions may repeat. Embedded built-ins are the base only when
; baseBundle is omitted.
; bundle=../share/example/resource-schema-extension

; Rendering defaults are explicit so invalid deployment edits fail at startup.
[mpp]
msaa=off
ssaa=off
taa=false
fxaa=false
